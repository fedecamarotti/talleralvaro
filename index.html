<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller Álvaro</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="theme-color" content="#0e0e11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taller">
<style>
:root{
  --bg:#0e0e11; --bg2:#17171c; --card:#1c1c22; --border:#2a2a31;
  --text:#f2f2f0; --text2:#a3a3ab; --muted:#6f6f78;
  --accent:#4f8cff; --accent-bg:rgba(79,140,255,.12);
  --danger:#e2504a; --danger-bg:rgba(226,80,74,.14);
  --success:#3fae6a; --success-bg:rgba(63,174,106,.14);
  --radius:12px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.hidden{display:none !important;}
.wrap{max-width:640px; margin:0 auto; padding:20px 16px 80px;}
h1{font-size:20px; font-weight:600; letter-spacing:-.01em;}
h2{font-size:15px; font-weight:600; color:var(--text2);}
input, textarea{
  width:100%; background:var(--bg2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:11px 13px; font-size:15px; outline:none; font-family:inherit;
  transition:border-color .15s;
}
input:focus, textarea:focus{border-color:var(--accent);}
textarea{resize:vertical; min-height:60px;}
label{display:block; font-size:12px; color:var(--muted); margin:14px 0 6px;}
label:first-child{margin-top:0;}
button{
  font-family:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--border);
  background:var(--bg2); color:var(--text); font-size:14px; padding:10px 16px;
  transition:background .15s, border-color .15s, transform .1s;
}
button:active{transform:scale(.97);}
button:hover{border-color:#3a3a42;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500;}
.btn-primary:hover{background:#3f7ce0;}
.btn-danger{color:var(--danger); border-color:var(--danger-bg);}
.btn-danger:hover{background:var(--danger-bg);}
.btn-icon{padding:7px 9px; font-size:13px; line-height:1;}
.btn-block{width:100%;}
.btn-ghost{background:transparent; border:none; color:var(--accent); padding:6px 0; font-size:13.5px;}

/* login */
#loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-box{width:100%; max-width:340px;}
.login-box h1{text-align:center; margin-bottom:28px; font-size:22px;}
.login-box input{margin-bottom:10px;}
.error{color:var(--danger); font-size:13px; margin-top:10px; min-height:16px;}

/* header */
header{
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:10; background:var(--bg);
  margin:-20px -16px 18px; padding:20px 16px 14px; border-bottom:1px solid var(--border);
}
header .actions{display:flex; gap:8px;}
#debtorsBtn.active{background:var(--danger-bg); border-color:var(--danger); color:var(--danger);}
.badge{
  display:inline-block; margin-left:6px; background:var(--danger); color:#fff;
  font-size:11px; border-radius:9px; padding:1px 6px; min-width:16px; text-align:center;
}

/* search */
.search-wrap{margin-bottom:14px;}
#searchInput{background:var(--bg2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="%236f6f78" stroke-width="2"><circle cx="6.5" cy="6.5" r="5"/><line x1="10.5" y1="10.5" x2="15" y2="15"/></svg>') no-repeat 12px center; padding-left:36px;}

/* client list */
.client-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:13px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; cursor:pointer;
  transition:border-color .15s;
}
.client-card:hover{border-color:#3a3a42;}
.avatar{
  width:40px; height:40px; border-radius:50%; background:var(--accent-bg); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; flex-shrink:0;
}
.client-info{flex:1; min-width:0;}
.client-info .name{font-weight:500; font-size:14.5px;}
.client-info .sub{font-size:12.5px; color:var(--text2); margin-top:1px;}
.debt-pill{
  font-size:11.5px; background:var(--danger-bg); color:var(--danger); padding:3px 9px;
  border-radius:8px; white-space:nowrap; font-weight:500;
}
.empty{color:var(--muted); font-size:14px; text-align:center; padding:40px 10px;}
.wa-btn{
  width:30px; height:30px; border-radius:50%; background:var(--success-bg); color:var(--success);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; border:none; font-size:16px;
}
.wa-btn:hover{background:rgba(63,174,106,.25);}

/* ficha */
#backBtn{
  color:var(--text2); background:var(--bg); border:none; border-radius:0;
  position:sticky; top:0; z-index:10; margin:-20px -16px 16px; padding:20px 16px 14px;
  border-bottom:1px solid var(--border); width:calc(100% + 32px); text-align:left; font-size:14px;
}
.client-card-big{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:20px;
}
.client-card-big .row1{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.client-card-big .avatar{width:46px; height:46px; font-size:14px; flex-shrink:0;}
.client-card-big .name{font-weight:600; font-size:16px;}
.client-card-big .phone{font-size:13px; color:var(--text2); margin-top:2px;}
.client-card-big .row1b{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
.client-card-big .row1b .card-actions{margin-left:auto;}
.client-card-big .row2{
  border-top:1px solid var(--border); padding-top:10px; margin-top:2px;
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
}
.field-label{font-size:11px; color:var(--muted);}
.field-value{font-size:13.5px; margin-top:2px;}
.card-actions{display:flex; gap:6px; margin-left:auto;}

.visits-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.visit-card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:12px;
}
.visit-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.visit-date{font-size:12.5px; color:var(--text2);}
.visit-km{font-size:11.5px; background:var(--accent-bg); color:var(--accent); padding:2px 8px; border-radius:8px; margin-top:6px; display:inline-block;}
.detail-row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:var(--text);}
.detail-row .d{color:var(--text2);}
.visit-notas{font-size:13px; color:var(--text2); background:var(--bg); border-radius:8px; padding:9px 11px; margin:6px 0 4px; white-space:pre-wrap;}
.visit-nums{margin:2px 0 8px;}
.visit-nums div{display:flex; justify-content:space-between; font-size:13.5px; color:var(--text2); padding:5px 0;}
.visit-nums div span:last-child{color:var(--text);}
.visit-total{
  border-top:1px solid var(--border); padding-top:8px; display:flex; justify-content:space-between;
  font-size:14px; font-weight:500; margin-bottom:8px;
}
.visit-pay{
  border-radius:8px; padding:8px 10px; display:flex; justify-content:space-between; font-size:12.5px;
}
.visit-pay.paid{background:var(--success-bg); color:var(--success);}
.visit-pay.debt{background:var(--danger-bg); color:var(--danger);}

/* modal */
.modal-bg{
  position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end;
  justify-content:center; z-index:50;
}
@media(min-width:520px){.modal-bg{align-items:center;}}
.modal{
  background:var(--bg2); border:1px solid var(--border); border-radius:16px 16px 0 0;
  width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:20px 20px 24px;
}
@media(min-width:520px){.modal{border-radius:16px;}}
.modal h2{color:var(--text); font-size:17px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-close{background:transparent; border:none; color:var(--text2); font-size:22px; line-height:1; padding:2px 4px;}
.modal-actions{display:flex; gap:10px; margin-top:20px;}
.modal-actions button{flex:1;}
.totalPreview{
  background:var(--accent-bg); color:var(--accent); border-radius:10px; padding:10px 13px;
  font-size:14px; font-weight:500; margin-top:14px; display:flex; justify-content:space-between;
}
.input-check-wrap{position:relative;}
.input-check-wrap input{padding-right:40px;}
.check-icon{
  position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:15px; font-weight:700;
}
.check-icon.ok{color:var(--success);}
.check-icon.bad{color:var(--danger);}
.detail-item{
  background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px;
  position:relative;
}
.detail-item .rm{
  position:absolute; top:8px; right:8px; background:transparent; border:none; color:var(--muted);
  font-size:13px; padding:2px 6px;
}
.pdf-modal{max-width:600px;}
.pdf-frame{width:100%; height:60vh; border:1px solid var(--border); border-radius:10px; background:#fff;}
.wa-share-btn{background:var(--success); border-color:var(--success); color:#fff; font-weight:500;}
.wa-share-btn:hover{background:#379a5c;}
</style>
</head>
<body>

<div id="loginScreen" class="screen">
  <div class="login-box">
    <h1>Taller Álvaro</h1>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="username">
    <input id="loginPass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button id="loginBtn" class="btn-primary btn-block">Ingresar</button>
    <p class="error" id="loginError"></p>
  </div>
</div>

<div id="mainScreen" class="screen hidden">
  <div class="wrap">
    <header>
      <h1>Taller</h1>
      <div class="actions">
        <button id="debtorsBtn">Deudores<span class="badge hidden" id="debtorsCount">0</span></button>
        <button id="logoutBtn" class="btn-icon">Salir</button>
      </div>
    </header>
    <div class="search-wrap">
      <input id="searchInput" placeholder="Buscar por nombre o apellido">
    </div>
    <button id="newClientBtn" class="btn-primary btn-block" style="margin-bottom:16px;">+ Nuevo cliente</button>
    <div id="clientList"></div>
  </div>
</div>

<div id="fichaScreen" class="screen hidden">
  <div class="wrap">
    <button id="backBtn">← Volver</button>
    <div id="clientCard"></div>
    <div class="visits-header">
      <h2>HISTORIAL DE VISITAS</h2>
      <div style="display:flex; gap:8px;">
        <button id="newPaymentBtn">+ Nuevo pago</button>
        <button id="newVisitBtn" class="btn-primary">+ Nueva visita</button>
      </div>
    </div>
    <div id="visitsList"></div>
  </div>
</div>

<div id="modalRoot"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBjxBmNOL72N2r4QzlT6MQUNooNvEivFss",
  authDomain: "talleralvaro.firebaseapp.com",
  projectId: "talleralvaro",
  storageBucket: "talleralvaro.firebasestorage.app",
  messagingSenderId: "951924407222",
  appId: "1:951924407222:web:1661b2d0e482c167a1df17"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let allClients = [];
let currentClientId = null;
let currentVisits = [];
let deudoresOnly = false;
let unsubClients = null, unsubVisits = null;
let detailCount = 0;

const $ = id => document.getElementById(id);
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const money = n => '$' + Math.round(n||0).toLocaleString('es-AR');
const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${parseInt(d)} ${meses[parseInt(m)-1]} ${y}`;
}
function initials(nombre, apellido){
  return ((nombre[0]||'')+(apellido[0]||'')).toUpperCase();
}

/* ---------- TELÉFONO ---------- */
function cleanPhone(raw){
  let d = (raw||'').replace(/\D/g,'');
  if(d.startsWith('0')) d = d.slice(1);
  d = d.replace(/^(\d{2,4})15/, '$1');
  return d;
}
function isValidPhone(raw){
  const d = cleanPhone(raw);
  return d.length >= 8 && d.length <= 11;
}
function waLink(raw){
  return `https://wa.me/549${cleanPhone(raw)}`;
}

/* ---------- INPUTS CON FORMATO ---------- */
function attachMoneyInput(el, initial){
  el.dataset.raw = initial ? String(Math.round(initial)) : '';
  el.value = initial ? money(initial) : '';
  el.addEventListener('input', () => {
    const digits = el.value.replace(/\D/g,'');
    el.dataset.raw = digits;
    el.value = digits ? money(parseInt(digits)) : '';
  });
}
function moneyValue(el){ return parseInt(el.dataset.raw||'0')||0; }

function attachKmInput(el, initial){
  el.dataset.raw = initial ? String(Math.round(initial)) : '';
  el.value = initial ? parseInt(initial).toLocaleString('es-AR') : '';
  el.addEventListener('input', () => {
    const digits = el.value.replace(/\D/g,'');
    el.dataset.raw = digits;
    el.value = digits ? parseInt(digits).toLocaleString('es-AR') : '';
  });
}
function kmValue(el){ return parseInt(el.dataset.raw||'0')||0; }

/* ---------- AUTH ---------- */
$('loginBtn').onclick = () => {
  $('loginError').textContent = '';
  auth.signInWithEmailAndPassword($('loginEmail').value.trim(), $('loginPass').value)
    .catch(err => { $('loginError').textContent = 'Email o contraseña incorrectos.'; });
};
$('logoutBtn').onclick = () => auth.signOut();

auth.onAuthStateChanged(user => {
  if(user){
    $('loginScreen').classList.add('hidden');
    $('mainScreen').classList.remove('hidden');
    listenClients();
  } else {
    $('mainScreen').classList.add('hidden');
    $('fichaScreen').classList.add('hidden');
    $('loginScreen').classList.remove('hidden');
    if(unsubClients) unsubClients();
    if(unsubVisits) unsubVisits();
  }
});

/* ---------- CLIENTS ---------- */
function listenClients(){
  unsubClients = db.collection('clientes').onSnapshot(snap => {
    allClients = snap.docs.map(d => ({id:d.id, ...d.data()}));
    renderClientList();
    if(currentClientId) renderClientCard();
  });
}

function renderClientList(){
  const q = norm($('searchInput').value);
  let list = allClients;
  if(deudoresOnly) list = list.filter(c => (c.totalDebe||0) > 0);
  if(q) list = list.filter(c => norm(c.nombre+' '+c.apellido).includes(q));
  list = list.slice().sort((a,b) => (a.apellido||'').localeCompare(b.apellido||''));

  const debtCount = allClients.filter(c => (c.totalDebe||0) > 0).length;
  const badge = $('debtorsCount');
  if(debtCount > 0){ badge.textContent = debtCount; badge.classList.remove('hidden'); }
  else badge.classList.add('hidden');

  const el = $('clientList');
  if(list.length === 0){
    el.innerHTML = `<div class="empty">${deudoresOnly ? 'No hay clientes con deuda.' : 'No se encontraron clientes.'}</div>`;
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="client-card" data-id="${c.id}">
      <div class="avatar">${initials(c.nombre||'', c.apellido||'')}</div>
      <div class="client-info">
        <div class="name">${c.nombre} ${c.apellido}</div>
        <div class="sub">${c.auto||''}${c.patente ? ' · '+c.patente : ''}</div>
      </div>
      ${(c.totalDebe||0) > 0 ? `<div class="debt-pill">Debe ${money(c.totalDebe)}</div>` : ''}
      ${isValidPhone(c.telefono) ? `<button class="wa-btn" data-wa="${c.telefono}" aria-label="Abrir WhatsApp"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.004 2.003c-5.514 0-9.997 4.483-9.997 9.997 0 1.762.462 3.478 1.34 4.995L2 22l5.116-1.341a9.958 9.958 0 0 0 4.888 1.34h.004c5.514 0 9.997-4.483 9.997-9.997 0-2.67-1.04-5.18-2.929-7.069a9.935 9.935 0 0 0-7.072-2.93zm0 18.198a8.185 8.185 0 0 1-4.166-1.14l-.299-.177-3.106.815.83-3.03-.194-.31a8.194 8.194 0 0 1-1.264-4.36c0-4.527 3.684-8.211 8.213-8.211a8.16 8.16 0 0 1 5.807 2.406 8.156 8.156 0 0 1 2.404 5.809c-.001 4.528-3.685 8.198-8.225 8.198z"/></svg></button>` : ''}
    </div>`).join('');
  el.querySelectorAll('.client-card').forEach(card => {
    card.onclick = (e) => { if(e.target.closest('.wa-btn')) return; openFicha(card.dataset.id); };
  });
  el.querySelectorAll('.wa-btn').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); window.open(waLink(btn.dataset.wa), '_blank'); };
  });
}

$('searchInput').oninput = renderClientList;
$('debtorsBtn').onclick = () => {
  deudoresOnly = !deudoresOnly;
  $('debtorsBtn').classList.toggle('active', deudoresOnly);
  renderClientList();
};
$('newClientBtn').onclick = () => openClientModal(null);
$('backBtn').onclick = () => {
  currentClientId = null;
  if(unsubVisits) unsubVisits();
  $('fichaScreen').classList.add('hidden');
  $('mainScreen').classList.remove('hidden');
};

/* ---------- FICHA ---------- */
function openFicha(id){
  currentClientId = id;
  $('mainScreen').classList.add('hidden');
  $('fichaScreen').classList.remove('hidden');
  renderClientCard();
  if(unsubVisits) unsubVisits();
  unsubVisits = db.collection('clientes').doc(id).collection('visitas')
    .orderBy('fecha','desc').onSnapshot(snap => {
      currentVisits = snap.docs.map(d => ({id:d.id, ...d.data()}));
      renderVisits();
    });
}

function renderClientCard(){
  const c = allClients.find(x => x.id === currentClientId);
  if(!c) return;
  $('clientCard').innerHTML = `
    <div class="client-card-big">
      <div class="row1">
        <div class="avatar">${initials(c.nombre||'', c.apellido||'')}</div>
        <div style="flex:1;">
          <div class="name">${c.nombre} ${c.apellido}</div>
          <div class="phone">${c.telefono||''}</div>
        </div>

/* ---------- PAGO SUELTO ---------- */
function openPaymentModal(){
  const today = new Date().toISOString().slice(0,10);
  const c = allClients.find(x => x.id === currentClientId);
  $('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal">
      <div class="modal-head">
        <h2>Nuevo pago</h2>
        <button type="button" class="modal-close" id="pClose">&times;</button>
      </div>
      <p style="color:var(--text2); font-size:13px; margin-bottom:6px;">Se aplica a la deuda de ${c?.nombre||''} ${c?.apellido||''}, empezando por las visitas más antiguas.</p>
      <label>Fecha</label><input id="pFecha" type="date" value="${today}">
      <label>Pagó</label><input id="pMonto" inputmode="numeric" placeholder="$0">
      <p class="error" id="pError"></p>
      <div class="modal-actions">
        <button id="pSave" class="btn-primary">Guardar</button>
      </div>
    </div></div>`;
  attachMoneyInput($('pMonto'), 0);
  $('pClose').onclick = closeModal;
  $('pSave').onclick = async () => {
    const monto = moneyValue($('pMonto'));
    if(monto <= 0){ $('pError').textContent = 'Ingresá un monto mayor a $0.'; return; }
    await applyPayment(currentClientId, monto);
    closeModal();
  };
}

async function applyPayment(clientId, monto){
  const snap = await db.collection('clientes').doc(clientId).collection('visitas')
    .orderBy('fecha','asc').get();
  const batch = db.batch();
  let restante = monto;
  snap.docs.forEach(doc => {
    if(restante <= 0) return;
    const v = doc.data();
    const debe = v.debe||0;
    if(debe <= 0) return;
    const aplicado = Math.min(debe, restante);
    restante -= aplicado;
    batch.update(doc.ref, { pago: (v.pago||0) + aplicado, debe: debe - aplicado });
  });
  await batch.commit();
  await recomputeDebt(clientId);
}

/* ---------- CLIENT MODAL ---------- */
function openClientModal(c){
  $('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal">
      <div class="modal-head">
        <h2>${c ? 'Editar cliente' : 'Nuevo cliente'}</h2>
        <button type="button" class="modal-close" id="mClose">&times;</button>
      </div>
      <label>Nombre</label><input id="mNombre" value="${c?.nombre||''}">
      <label>Apellido</label><input id="mApellido" value="${c?.apellido||''}">
      <label>Teléfono</label>
      <div class="input-check-wrap">
        <input id="mTelefono" value="${c?.telefono||''}" placeholder="Ej: 1156637845">
        <span class="check-icon" id="mTelefonoCheck"></span>
      </div>
      <label>Auto</label><input id="mAuto" value="${c?.auto||''}">
      <label>Año</label><input id="mAnio" inputmode="numeric" value="${c?.anio||''}" placeholder="Ej: 2019">
      <label>Patente</label><input id="mPatente" value="${(c?.patente||'').toUpperCase()}">
      <p class="error" id="mError"></p>
      <div class="modal-actions">
        <button id="mSave" class="btn-primary">Guardar</button>
      </div>
    </div></div>`;
  $('mClose').onclick = closeModal;
  const telInput = $('mTelefono'), telCheck = $('mTelefonoCheck');
  const updateTelCheck = () => {
    if(!telInput.value.trim()){ telCheck.textContent = ''; return; }
    if(isValidPhone(telInput.value)){ telCheck.textContent = '✓'; telCheck.className = 'check-icon ok'; }
    else{ telCheck.textContent = '✕'; telCheck.className = 'check-icon bad'; }
  };
  telInput.addEventListener('input', updateTelCheck);
  updateTelCheck();
  const patInput = $('mPatente');
  patInput.addEventListener('input', () => {
    const pos = patInput.selectionStart;
    patInput.value = patInput.value.toUpperCase();
    patInput.setSelectionRange(pos, pos);
  });
  $('mSave').onclick = async () => {
    const nombre = $('mNombre').value.trim(), apellido = $('mApellido').value.trim();
    if(!nombre || !apellido){ $('mError').textContent = 'Completá nombre y apellido.'; return; }
    const data = {
      nombre, apellido,
      telefono: telInput.value.trim(),
      auto: $('mAuto').value.trim(),
      anio: $('mAnio').value.trim(),
      patente: patInput.value.trim().toUpperCase()
    };
    if(c){
      await db.collection('clientes').doc(c.id).update(data);
    } else {
      data.totalDebe = 0;
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('clientes').add(data);
    }
    closeModal();
  };
}

async function deleteClient(id){
  const visitasSnap = await db.collection('clientes').doc(id).collection('visitas').get();
  const batch = db.batch();
  visitasSnap.forEach(d => batch.delete(d.ref));
  batch.delete(db.collection('clientes').doc(id));
  await batch.commit();
  currentClientId = null;
  $('fichaScreen').classList.add('hidden');
  $('mainScreen').classList.remove('hidden');
}

/* ---------- VISIT MODAL ---------- */
function detailRowHtml(idx, desc, rep){
  return `
    <div class="detail-item" data-idx="${idx}">
      <button type="button" class="rm" data-rm="${idx}">Quitar</button>
      <label>Detalle</label><input class="detDesc" data-idx="${idx}" value="${desc||''}" placeholder="Ej: correa de distribución">
      <label>Valor repuestos</label><input class="detRep" data-idx="${idx}" placeholder="$0">
    </div>`;
}

function openVisitModal(v){
  const today = new Date().toISOString().slice(0,10);
  const detalles = (v?.detalles && v.detalles.length) ? v.detalles : [{descripcion:'', repuestos:0}];
  detailCount = detalles.length;

  $('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal">
      <div class="modal-head">
        <h2>${v ? 'Editar visita' : 'Nueva visita'}</h2>
        <button type="button" class="modal-close" id="vClose">&times;</button>
      </div>
      <label>Fecha</label><input id="vFecha" type="date" value="${v?.fecha||today}">
      <label>Kilómetros</label><input id="vKm" inputmode="numeric" placeholder="Ej: 127.000">
      <label style="margin-top:18px;">Detalles</label>
      <div id="detailsList"></div>
      <button type="button" class="btn-ghost" id="addDetailBtn">+ Agregar detalle</button>
      <label>Notas</label><textarea id="vNotas" placeholder="Observaciones, recomendaciones, etc.">${v?.notas||''}</textarea>
      <label>Mano de obra</label><input id="vMano" inputmode="numeric" placeholder="$0">
      <div class="totalPreview"><span>Total</span><span id="vTotalPreview">$0</span></div>
      <label>Pagó</label><input id="vPago" inputmode="numeric" placeholder="$0">
      <p class="error" id="vError"></p>
      <div class="modal-actions">
        <button id="vSave" class="btn-primary">Guardar</button>
      </div>
    </div></div>`;
  $('vClose').onclick = closeModal;

  attachKmInput($('vKm'), v?.km);
  attachMoneyInput($('vMano'), v?.manoObra);
  attachMoneyInput($('vPago'), v?.pago);

  const detailsList = $('detailsList');
  function renderDetailRows(){
    detailsList.innerHTML = detalles.map((d,i) => detailRowHtml(i, d.descripcion, d.repuestos)).join('');
    detalles.forEach((d,i) => {
      const repEl = detailsList.querySelector(`.detRep[data-idx="${i}"]`);
      attachMoneyInput(repEl, d.repuestos);
      repEl.addEventListener('input', updateTotal);
      detailsList.querySelector(`.detDesc[data-idx="${i}"]`).addEventListener('input', (e) => {
        detalles[i].descripcion = e.target.value;
      });
    });
    detailsList.querySelectorAll('[data-rm]').forEach(btn => {
      btn.onclick = () => {
        if(detalles.length <= 1) return;
        detalles.splice(parseInt(btn.dataset.rm), 1);
        renderDetailRows();
        updateTotal();
      };
    });
  }
  renderDetailRows();

  $('addDetailBtn').onclick = () => {
    detalles.push({descripcion:'', repuestos:0});
    renderDetailRows();
    updateTotal();
  };

  function updateTotal(){
    let repTotal = 0;
    detailsList.querySelectorAll('.detRep').forEach(el => { repTotal += moneyValue(el); });
    const mano = moneyValue($('vMano'));
    $('vTotalPreview').textContent = money(repTotal + mano);
  }
  $('vMano').addEventListener('input', updateTotal);
  updateTotal();

  $('vSave').onclick = async () => {
    const fecha = $('vFecha').value;
    if(!fecha){ $('vError').textContent = 'Elegí una fecha.'; return; }
    const detallesOut = [];
    detailsList.querySelectorAll('.detail-item').forEach(item => {
      const idx = item.dataset.idx;
      const desc = item.querySelector('.detDesc').value.trim();
      const rep = moneyValue(item.querySelector('.detRep'));
      if(desc || rep) detallesOut.push({descripcion:desc, repuestos:rep});
    });
    const manoObra = moneyValue($('vMano'));
    const pago = moneyValue($('vPago'));
    const repTotal = detallesOut.reduce((s,d) => s + (d.repuestos||0), 0);
    const total = repTotal + manoObra;
    const debe = Math.max(0, total - pago);
    const data = {
      fecha, km: kmValue($('vKm')),
      detalles: detallesOut,
      notas: $('vNotas').value.trim(),
      manoObra, pago, total, debe
    };
    if(v){
      await db.collection('clientes').doc(currentClientId).collection('visitas').doc(v.id).update(data);
    } else {
      data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection('clientes').doc(currentClientId).collection('visitas').add(data);
    }
    await recomputeDebt(currentClientId);
    closeModal();
  };
}

async function deleteVisit(id){
  await db.collection('clientes').doc(currentClientId).collection('visitas').doc(id).delete();
  await recomputeDebt(currentClientId);
}

async function recomputeDebt(clientId){
  const snap = await db.collection('clientes').doc(clientId).collection('visitas').get();
  let totalDebe = 0;
  snap.forEach(d => totalDebe += (d.data().debe||0));
  await db.collection('clientes').doc(clientId).update({totalDebe});
}

function confirmDelete(label, onConfirm){

    <div class="modal-bg"><div class="modal">

      <p style="color:var(--text2); font-size:14px; margin-bottom:4px;">Esta acción no se puede deshacer.</p>

        <button id="cCancel">Cancelar</button>
        <button id="cConfirm" class="btn-danger">Eliminar</button>
      </div>
    </div></div>`;
  $('cCancel').onclick = closeModal;
  $('cConfirm').onclick = async () => { await onConfirm(); closeModal(); };
}

function buildVisitPDF(v, c){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const pageW = 210, margin = 15, colW = pageW - margin*2;

  // banda superior
  doc.setFillColor(235,235,235);
  doc.rect(0,0,pageW,13,'F');
  doc.setTextColor(40,40,40);
  doc.setFont(undefined,'bold'); doc.setFontSize(11);
  doc.text('TALLER ÁLVARO', margin, 8.5);

  // título
  doc.setFillColor(24,24,27);
  doc.rect(0,13,pageW,16,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(17);
  doc.text('COMPROBANTE DE VISITA', pageW/2, 23.5, {align:'center'});

  doc.setTextColor(30,30,30);
  let y = 40;

  // datos cliente / vehículo
  doc.setFont(undefined,'bold'); doc.setFontSize(9); doc.setTextColor(120,120,120);
  doc.text('CLIENTE', margin, y);
  doc.text('VEHÍCULO', margin+colW/2, y);
  y += 6;
  doc.setFont(undefined,'normal'); doc.setFontSize(12); doc.setTextColor(30,30,30);
  doc.text(`${c.nombre} ${c.apellido}`, margin, y);
  doc.text(`${c.auto||'—'}`, margin+colW/2, y);
  y += 6;
  doc.setFontSize(10); doc.setTextColor(90,90,90);
  doc.text(c.telefono||'', margin, y);
  doc.text(`${c.patente||''}${c.anio ? '  ·  '+c.anio : ''}`, margin+colW/2, y);
  y += 6;
  doc.text(`Fecha: ${fmtDate(v.fecha)}`, margin, y);
  if(v.km) doc.text(`Kilometraje: ${parseInt(v.km).toLocaleString('es-AR')} km`, margin+colW/2, y);
  y += 10;

  // tabla
  doc.setFillColor(235,235,235);
  doc.rect(margin, y, colW, 8, 'F');
  doc.setFont(undefined,'bold'); doc.setFontSize(10); doc.setTextColor(50,50,50);
  doc.text('DETALLE', margin+3, y+5.5);
  doc.text('VALOR', margin+colW-3, y+5.5, {align:'right'});
  y += 8;

  doc.setFont(undefined,'normal'); doc.setFontSize(11); doc.setTextColor(30,30,30);
  (v.detalles||[]).forEach(d => {
    y += 8;
    doc.text(d.descripcion||'', margin+3, y);
    doc.text(money(d.repuestos), margin+colW-3, y, {align:'right'});
    doc.setDrawColor(225,225,225);
    doc.line(margin, y+3, margin+colW, y+3);
  });
  y += 8;
  doc.text('Mano de obra', margin+3, y);
  doc.text(money(v.manoObra), margin+colW-3, y, {align:'right'});
  doc.setDrawColor(225,225,225);
  doc.line(margin, y+3, margin+colW, y+3);
  y += 10;

  // notas
  if(v.notas){
    doc.setFont(undefined,'italic'); doc.setFontSize(9.5); doc.setTextColor(100,100,100);
    const lines = doc.splitTextToSize(v.notas, colW-6);
    doc.text(lines, margin+3, y);
    y += lines.length*4.5 + 6;
  }

  // totales
  y += 4;
  const boxW = 80, boxX = margin+colW-boxW;
  doc.setDrawColor(210,210,210);
  doc.line(boxX, y, boxX+boxW, y);
  y += 7;
  doc.setFont(undefined,'bold'); doc.setFontSize(12); doc.setTextColor(30,30,30);
  doc.text('Total', boxX, y);
  doc.text(money(v.total), boxX+boxW, y, {align:'right'});
  y += 7;
  doc.setFont(undefined,'normal'); doc.setFontSize(10.5); doc.setTextColor(80,80,80);
  doc.text('Pagó', boxX, y);
  doc.text(money(v.pago), boxX+boxW, y, {align:'right'});
  y += 6.5;
  doc.setFont(undefined,'bold');
  doc.setTextColor(v.debe > 0 ? 190 : 30, v.debe > 0 ? 60 : 140, v.debe > 0 ? 55 : 70);
  doc.text(v.debe > 0 ? 'Debe' : 'Pagado', boxX, y);
  if(v.debe > 0) doc.text(money(v.debe), boxX+boxW, y, {align:'right'});

  return doc;
}

function exportVisitPDF(v){
  const c = allClients.find(x => x.id === currentClientId);
  if(!c || !v) return;
  const doc = buildVisitPDF(v, c);
  const blobUrl = doc.output('bloburl');
  $('modalRoot').innerHTML = `
    <div class="modal-bg"><div class="modal pdf-modal">
      <div class="modal-head">
        <h2>Comprobante de visita</h2>
        <button type="button" class="modal-close" id="pdfClose">&times;</button>
      </div>
      <iframe class="pdf-frame" src="${blobUrl}"></iframe>
      <div class="modal-actions">
        <button id="pdfDownload">Descargar</button>
        ${isValidPhone(c.telefono) ? `<button id="pdfWhatsapp" class="wa-share-btn">Enviar por WhatsApp</button>` : ''}
      </div>
    </div></div>`;
  $('pdfClose').onclick = closeModal;
  $('pdfDownload').onclick = () => doc.save(`visita-${c.apellido}-${v.fecha}.pdf`);
  const waBtn = $('pdfWhatsapp');
  if(waBtn) waBtn.onclick = () => shareVisitPDF(doc, c, v);
}

async function shareVisitPDF(doc, c, v){
  const filename = `visita-${c.apellido}-${v.fecha}.pdf`;
  const blob = doc.output('blob');
  const file = new File([blob], filename, {type:'application/pdf'});
  const mensaje = `Hola ${c.nombre}, te paso el detalle de la visita del ${fmtDate(v.fecha)} al taller.`;
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'Comprobante de visita', text: mensaje});
      return;
    }catch(e){ /* el usuario canceló o falló, seguimos al fallback */ }
  }
  doc.save(filename);
  window.open(`${waLink(c.telefono)}?text=${encodeURIComponent(mensaje + ' (te acabo de descargar el PDF, adjuntalo en el chat)')}`, '_blank');
}

function closeModal(){ $('modalRoot').innerHTML = ''; }

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
}
